{% extends "chores/base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Log in</h1>

{% if form.errors %}
<p class="overdue-label">Your username and password didn't match. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'login' %}" class="form-fields">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
</form>
{% endblock %}
